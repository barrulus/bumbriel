# Reusable effect definitions. This file does not assign effects to apps.
# Border definitions describe the frame; their optional overlay references a
# scope="border" preset for the matching inward effect. Window presets affect
# the client content independently. These table names are Umbriel's native syntax.

[shaders.border.flowering-vine]
enabled = true
animated = true
speed = 1
padding = 8
shader = "shaders/rings/flowering-vine.glsl"
overlay = "ring.flowering-vine"
[shaders.border.flowering-vine.light]
enabled = true
spread = 16
intensity = 0.25
threshold = 0.75

[shaders.preset."ring.flowering-vine"]
scope = "border"
passes = [{ shader = "shaders/window/flowering-vine-overlay.glsl" }]

# Border effect definitions (including paired inward overlays)
[shaders.border.fuse]
enabled = true
animated = true
speed = 1
shader = "shaders/rings/fuse.glsl"
padding = 48
[shaders.border.fuse.light]
enabled = true
spread = 90
intensity = 1.4
threshold = 0.5

[shaders.border.lightning]
enabled = true
animated = true
speed = 1
shader = "shaders/rings/lightning.glsl"
padding = 24
[shaders.border.lightning.light]
enabled = true
spread = 80
intensity = 1.0
threshold = 0.5

[shaders.border.rainbow]
enabled = true
animated = true
speed = 1
shader = "shaders/rings/rainbow-ripple.glsl"
padding = 14
overlay = "ring.rainbow"
[shaders.border.rainbow.light]
enabled = false

[shaders.preset."ring.rainbow"]
scope = "border"
passes = [{ shader = "shaders/window/rainbow-ripple-overlay.glsl" }]

[shaders.border.pulse]
enabled = true
