# Named lists of effects. Edit presets to add, remove or reorder members.
# Definitions live in effects.toml; assignments live in config.toml.

[shaders.pool.desktop]
scope = "border"
presets = ["flowering-vine"]

[shaders.pool.favourites]
scope = "window"
presets = ["window.crt", "window.parchment-dark", "window.fire-tendrils", "window.autumn-leaves", "window.mercury-sheen", "window.prairie-wind", "window.rainbow-radial", "window.rainbow-smoke", "window.rainbow-waves", "window.ripple-drops", "window.rolling-clouds", "window.rorschach2", "window.sentient-circuit-v2", "window.snowfall"]

[shaders.pool.terminals]
scope = "border"
allocation = "unused-first"
presets = ["fuse", "lightning", "rainbow", "pulse", "neon-bleed", "portal-lava", "flowering-vine", "sentient-runner", "sentient-spark", "flowing-water", "faerie-magic"]
