# Include after defaults.toml. Movement includes animated resize and layout changes.
[animation]
enabled = true

[animation.windows_in]
enabled = true
duration_ms = 620
curve = "linear"
shader = "shaders/animations/wobbly-lifecycle.glsl"

[animation.windows_out]
enabled = true
duration_ms = 460
curve = "linear"
shader = "shaders/animations/wobbly-lifecycle.glsl"

[animation.windows_move]
enabled = true
wobble = true
duration_ms = 650
curve = "easeout"
shader = "shaders/animations/wobbly-move.glsl"

[animation.pair.wobbly.open]
shader = "shaders/animations/wobbly-lifecycle.glsl"
duration_ms = 620
curve = "linear"

[animation.pair.wobbly.close]
shader = "shaders/animations/wobbly-lifecycle.glsl"
duration_ms = 460
curve = "linear"
