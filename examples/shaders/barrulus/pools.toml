# Include alongside windows.toml. Ring paths are relative to this file.
[shaders]
window_pool = "favourites"

[shaders.pool.favourites]
scope = "window"
presets = ["window.crt", "window.parchment-dark", "window.adaptive-text-v4"]

[shaders.pool.terminals]
scope = "border"
allocation = "unused-first" # or "round-robin"
presets = ["fuse", "lightning", "rainbow", "pulse"]

[shaders.border.fuse]
shader = "rings/fuse.glsl"
padding = 48
[shaders.border.fuse.light]
enabled = true
spread = 90
intensity = 1.4
threshold = 0.5

[shaders.border.lightning]
shader = "rings/lightning.glsl"
padding = 24
[shaders.border.lightning.light]
enabled = true
spread = 80
intensity = 1.0
threshold = 0.5

[shaders.border.rainbow]
shader = "rings/rainbow-ripple.glsl"
padding = 14

[shaders.border.pulse]
shader = "rings/pulse.glsl"
padding = 0

[[window_rule]]
match.app_id = "^(com[.]mitchellh[.]ghostty|ghostty|kitty|net[.]kovidgoyal[.]kitty)$"
[window_rule.border_shader]
pool = "terminals"

[keybinds]
"Mod+S" = { action = "shader:window cycle", repeat = false }
"Mod+Shift+S" = { action = "shader:window toggle", repeat = false }
"Mod+Alt+S" = { action = "shader:border cycle:terminals", repeat = false }
