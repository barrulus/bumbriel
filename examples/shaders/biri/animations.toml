# Register the four matched lifecycle pairs for shader:animation selection.

[animation.pair.whirlpool.open]
shader = "whirlpool-open.glsl"
duration_ms = 400
curve = "linear"

[animation.pair.whirlpool.close]
shader = "whirlpool-close.glsl"
duration_ms = 500
curve = "linear"

[animation.pair.melt.open]
shader = "melt-open.glsl"
duration_ms = 400
curve = "linear"

[animation.pair.melt.close]
shader = "melt-close.glsl"
duration_ms = 500
curve = "linear"

[animation.pair.ripple.open]
shader = "ripple-open.glsl"
duration_ms = 400
curve = "linear"

[animation.pair.ripple.close]
shader = "ripple-close.glsl"
duration_ms = 500
curve = "linear"

[animation.pair.lightning.open]
shader = "lightning-open.glsl"
duration_ms = 400
curve = "linear"

[animation.pair.lightning.close]
shader = "lightning-close.glsl"
duration_ms = 400
curve = "linear"
