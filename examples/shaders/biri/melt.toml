# Include this file from your config; paths resolve beside this file.
[animation.windows_in]
enabled = true
duration_ms = 400
curve = "linear"
shader = "melt-open.glsl"

[animation.windows_out]
enabled = true
duration_ms = 500
curve = "linear"
shader = "melt-close.glsl"

# Named pair for shader:animation selection and cycling.
[animation.pair.melt.open]
shader = "melt-open.glsl"
duration_ms = 400
curve = "linear"

[animation.pair.melt.close]
shader = "melt-close.glsl"
duration_ms = 500
curve = "linear"
