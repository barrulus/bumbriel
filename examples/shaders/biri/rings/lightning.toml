# Applies to the active complete border; padding reserves raster space only.
[appearance]
border_width = 6
outer_border_width = 0

[appearance.border_shader]
enabled = true
animated = true
speed = 1
padding = 24
shader = "lightning.glsl"

# Optional moving illumination; disable this block for the ring alone.
[appearance.border_shader.light]
enabled = true
spread = 80
intensity = 1.0
threshold = 0.5
